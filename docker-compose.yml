services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_URL: http://localhost:3001/api
        NUXT_PUBLIC_HELPDESK_URL: http://localhost:3002
        NUXT_API_URL: http://host.docker.internal:3001/api
    container_name: coffee-cherry-crm
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      HOST: 0.0.0.0
      PORT: 3003
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3003
      NUXT_PUBLIC_API_URL: http://localhost:3001/api
      NUXT_PUBLIC_HELPDESK_URL: http://localhost:3002
      NUXT_API_URL: http://host.docker.internal:3001/api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
